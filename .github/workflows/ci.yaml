name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renderer:
    name: Renderer (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: addon/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: addon/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  app-image:
    name: App image builds (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: addon
          push: false
          platforms: linux/amd64
          tags: kindledash:ci

  integration:
    name: Integration (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          # The default ref lookup breaks on branch names containing slashes; pin the commit.
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          # GitHub only detects the license on the default branch, so skip that check on PRs.
          ignore: ${{ github.event_name == 'pull_request' && 'brands license' || 'brands' }}

  shellcheck:
    name: Kindle scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck -s sh kindle/extensions/kindledash/bin/*.sh kindle/extensions/kindledash/config.sh
