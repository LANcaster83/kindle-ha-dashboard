# https://developers.home-assistant.io/docs/apps/configuration
name: Kindle Dashboard Renderer
version: "0.2.0"
slug: kindledash
description: Renders a Lovelace dashboard with headless Chromium into an e-ink friendly PNG for a jailbroken Kindle.
url: https://github.com/LANcaster83/kindle-ha-dashboard/tree/main/addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Chromium needs user namespaces / seccomp tweaks that the default profile blocks.
apparmor: false
# Lets the app ask the Supervisor (GET /core/info) which port Home Assistant listens on
# when ha_url is left empty. The default role is enough for that endpoint.
hassio_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: HTTP server exposing /kindle.png, /status, /render and /health
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "http://[HOST]:[PORT:8080]/health"
options:
  access_token: null
  dashboard_path: "/dashboard-test-2"
  url_query: ""
  width: 1680
  height: 1264
  rotation: "90"
  zoom: 1.0
  interval: 60
  render_delay_ms: 1500
  color_scheme: light
  theme: ""
  language: ""
  hide_header: true
  gray_levels: 16
  dither: true
  contrast: 1.15
  server_token: ""
schema:
  ha_url: url?
  access_token: password
  dashboard_path: str
  url_query: str?
  width: int(100,4096)
  height: int(100,4096)
  rotation: list(0|90|180|270)
  zoom: float(0.25,4.0)
  interval: int(10,86400)
  render_delay_ms: int(0,60000)
  color_scheme: list(light|dark)
  theme: str?
  language: str?
  hide_header: bool
  gray_levels: int(2,256)
  dither: bool
  contrast: float(0.5,3.0)
  server_token: password?
