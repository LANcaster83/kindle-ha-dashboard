name: kindle-ha-dashboard

services:
  kindledash:
    build:
      context: ./addon
    image: kindle-ha-dashboard/kindledash:dev
    env_file:
      - .env
    environment:
      KD_PORT: "8080"
    ports:
      - "${KD_HOST_PORT:-8080}:8080"
    volumes:
      - kindledash-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kindledash-data:
    name: kindle-ha-dashboard-kindledash-data
